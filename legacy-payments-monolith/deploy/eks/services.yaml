# One Deployment + Service per proposed bounded context. Images are placeholders.
# Replicas/limits are starting points to validate in a load test, not recommendations.
apiVersion: apps/v1
kind: Deployment
metadata: { name: mobile-bff, namespace: core, labels: { app: mobile-bff } }
spec:
  replicas: 3
  selector: { matchLabels: { app: mobile-bff } }
  template:
    metadata: { labels: { app: mobile-bff } }
    spec:
      serviceAccountName: mobile-bff
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: app
          image: ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/mobile-bff:REPLACE_TAG
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 5 }
          resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true }
---
apiVersion: v1
kind: Service
metadata: { name: mobile-bff, namespace: core }
spec:
  selector: { app: mobile-bff }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: mobile-bff, namespace: core }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: mobile-bff }
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: payments-core, namespace: core, labels: { app: payments-core } }
spec:
  replicas: 3
  selector: { matchLabels: { app: payments-core } }
  template:
    metadata: { labels: { app: payments-core } }
    spec:
      serviceAccountName: payments-core
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: app   # payments + fraud scoring ship together: they were a circular dependency
          image: ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/payments-core:REPLACE_TAG
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 5 }
          resources: { requests: { cpu: 500m, memory: 512Mi }, limits: { cpu: "2", memory: 1Gi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true }
---
apiVersion: v1
kind: Service
metadata: { name: payments-core, namespace: core }

AWSTemplateFormatVersion: "2010-09-09"
Description: Private interview-prep site. S3 (no public access) + CloudFront (OAC) + basic-auth function.
Parameters:
  AuthToken:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: base64("user:password") for basic auth. deploy.sh computes this.
Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
  OAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name:
          Fn::Sub: "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  AuthFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name:
        Fn::Sub: "${AWS::StackName}-auth"
      AutoPublish: true
      FunctionConfig: { Comment: Basic auth, Runtime: cloudfront-js-2.0 }
      FunctionCode:
        Fn::Sub: |
          function handler(event) {
            var req = event.request;
            var expected = 'Basic ${AuthToken}';
            var h = req.headers.authorization;
            if (!h || h.value !== expected) {
              return { statusCode: 401, statusDescription: 'Unauthorized',
                headers: { 'www-authenticate': { value: 'Basic realm="prep"' } } };
            }
            if (req.uri.endsWith('/')) { req.uri += 'index.html'; }
            return req;
          }
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        Origins:
          - Id: s3
            DomainName:
              Fn::GetAtt: [SiteBucket, RegionalDomainName]
            OriginAccessControlId:
              Fn::GetAtt: [OAC, Id]
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: s3
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad   # CachingDisabled: edits show immediately
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN:
                Fn::GetAtt: [AuthFunction, FunctionMetadata.FunctionARN]
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: { Ref: SiteBucket }
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource:
              Fn::Sub: "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn:
                  Fn::Sub: "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
Outputs:
  SiteUrl:
    Value:
      Fn::Sub: "https://${Distribution.DomainName}/"
  BucketName:
    Value: { Ref: SiteBucket }
